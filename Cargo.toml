[package]
name = "nostr-engine"
version = "0.10.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Standalone local Nostr backend with HTTP API - query nostrdb and fetch from relays"
repository = "https://github.com/youruser/nostr-engine"
keywords = ["nostr", "relay", "database", "api"]
categories = ["database", "web-programming"]
default-run = "tendrl-engine"

[lib]
name = "nostr_engine"
path = "src/lib.rs"

# Executable is `tendrl-engine`; the internal lib crate stays `nostr_engine`
# (all `use nostr_engine::` imports), and the on-disk data dir + keyring
# service keep the `nostr-engine` name so existing installs aren't orphaned.
[[bin]]
name = "tendrl-engine"
path = "src/main.rs"
required-features = ["desktop"]

[features]
# Desktop builds keep today's exact behavior; the Android host builds the lib
# with --no-default-features (+ embed-assets) to drop the deps that don't
# cross-compile or don't apply on-device.
default = ["embeddings", "keyring", "desktop"]
# Semantic search backends. `embeddings` links the prebuilt onnxruntime that
# ort downloads at build time (no prebuilts exist for Android targets);
# `embeddings-dynamic` dlopens a libonnxruntime.so provided at runtime (the
# Android path — the APK ships Microsoft's onnxruntime-android). Enable exactly
# one; both compile the same EmbeddingIndex.
embeddings = ["dep:fastembed", "dep:usearch", "fastembed/ort-download-binaries"]
embeddings-dynamic = ["dep:fastembed", "dep:usearch", "fastembed/ort-load-dynamic"]
# OS keyring persistence (assistant identity). No Secret Service on Android —
# the stub degrades to session-only, which consumers already handle.
keyring = ["dep:keyring"]
# Browser-open on launch; the binary is desktop-only.
desktop = ["dep:webbrowser"]
# Bake web/build/ into the binary even in debug profiles (rust-embed otherwise
# reads from disk in debug, and that path doesn't exist inside an APK).
embed-assets = ["rust-embed/debug-embed"]

[dependencies]
# Nostr database
nostrdb = { git = "https://github.com/damus-io/nostrdb-rs", rev = "652db3c6ed223a83348969dfcc452f82fc96279c" }

# HTTP server
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# WebSocket client for relay fetching. Both rustls root sources on purpose:
# native-roots reads the OS trust store (desktop; corporate/custom CAs keep
# working) and webpki-roots bundles the Mozilla set as the fallback that
# makes wss:// work on Android, where rustls-native-certs finds no OS store
# at all ("no native root CA certificates found" on every relay otherwise).
# tokio-tungstenite treats an empty native store as non-fatal when webpki
# roots are also enabled.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (for LLM API calls)
# default-features off to drop `default-tls` (native-tls/OpenSSL); rustls-tls is
# the only TLS backend so the distributable binary needs no system libssl.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "charset", "http2"] }

# Utilities
hex = "0.4"
sha2 = "0.10"
async-trait = "0.1"
async-stream = "0.3"
nanoid = "0.4"
url = "2"

# Identity/key management
keyring = { version = "3", optional = true }
bech32 = "0.11"
chacha20poly1305 = "0.10"
scrypt = "0.11"
secp256k1 = { version = "0.29", features = ["global-context"] }
unicode-normalization = "0.1"
# Wipe decrypted secret keys from memory on drop (lock/logout) so they don't
# linger in the heap/swap.
zeroize = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Vector search
usearch = { version = "2", optional = true }

# In-process ONNX embeddings (the only embedding backend).
# default-features off to swap hf-hub's TLS from native-tls (OpenSSL) to rustls
# so the distributable binary carries no libssl/libcrypto dependency. The ort
# backend (ort-download-binaries vs ort-load-dynamic) is selected by the
# `embeddings` / `embeddings-dynamic` cargo features above.
fastembed = { version = "4", default-features = false, features = ["hf-hub-rustls-tls"], optional = true }

# Single-exe bundling: embed the built SPA (web/build/) into the binary and
# open the browser on launch. In debug builds rust-embed reads from disk so the
# UI hot-reloads without a rebuild; release builds bake the assets in.
rust-embed = { version = "8", features = ["mime-guess"] }
webbrowser = { version = "1", optional = true }
# In-process document text extraction (replaces the Python sidecar /parse).
pdf-extract = "0.10.0"
epub = "2.1.5"
html2text = "0.17.1"
# DOCX is a zip of XML; only the deflate codec is needed, so drop zip's heavy
# default codecs (zstd/bzip2 and their C builds) to keep the build light.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "0.40.1"

[dev-dependencies]
tempfile = "3.24.0"
tokio-test = "0.4"
# oneshot() in the loopback-guard middleware tests
tower = { version = "0.5", features = ["util"] }

# NOTE: mobile/src-tauri/ is its own workspace root — this profile does NOT
# reach the Android build; it carries its own [profile.release].
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
