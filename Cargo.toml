[package]
name = "nostr-engine"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Standalone local Nostr backend with HTTP API - query nostrdb and fetch from relays"
repository = "https://github.com/youruser/nostr-engine"
keywords = ["nostr", "relay", "database", "api"]
categories = ["database", "web-programming"]
default-run = "nostr-engine"

[lib]
name = "nostr_engine"
path = "src/lib.rs"

[[bin]]
name = "nostr-engine"
path = "src/main.rs"

[features]
default = []
onnx = ["fastembed"]

[dependencies]
# Nostr database
nostrdb = { git = "https://github.com/damus-io/nostrdb-rs", rev = "652db3c6ed223a83348969dfcc452f82fc96279c" }

# HTTP server
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# WebSocket client for relay fetching
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (for LLM API calls)
reqwest = { version = "0.12", features = ["json", "native-tls", "multipart"] }

# Utilities
hex = "0.4"
sha2 = "0.10"
async-trait = "0.1"

# Identity/key management
keyring = "3"
bech32 = "0.11"
chacha20poly1305 = "0.10"
scrypt = "0.11"
secp256k1 = { version = "0.29", features = ["global-context"] }
unicode-normalization = "0.1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Vector search
usearch = "2"

# ONNX embeddings (optional, for --features onnx)
fastembed = { version = "4", optional = true }

[dev-dependencies]
tempfile = "3.24.0"
tokio-test = "0.4"
