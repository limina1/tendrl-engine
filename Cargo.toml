[package]
name = "nostr-engine"
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Standalone local Nostr backend with HTTP API - query nostrdb and fetch from relays"
repository = "https://github.com/youruser/nostr-engine"
keywords = ["nostr", "relay", "database", "api"]
categories = ["database", "web-programming"]
default-run = "tendrl-engine"

[lib]
name = "nostr_engine"
path = "src/lib.rs"

# Executable is `tendrl-engine`; the internal lib crate stays `nostr_engine`
# (all `use nostr_engine::` imports), and the on-disk data dir + keyring
# service keep the `nostr-engine` name so existing installs aren't orphaned.
[[bin]]
name = "tendrl-engine"
path = "src/main.rs"

[features]
default = []

[dependencies]
# Nostr database
nostrdb = { git = "https://github.com/damus-io/nostrdb-rs", rev = "652db3c6ed223a83348969dfcc452f82fc96279c" }

# HTTP server
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# WebSocket client for relay fetching
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (for LLM API calls)
# default-features off to drop `default-tls` (native-tls/OpenSSL); rustls-tls is
# the only TLS backend so the distributable binary needs no system libssl.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "charset", "http2"] }

# Utilities
hex = "0.4"
sha2 = "0.10"
async-trait = "0.1"
async-stream = "0.3"
nanoid = "0.4"
url = "2"

# Identity/key management
keyring = "3"
bech32 = "0.11"
chacha20poly1305 = "0.10"
scrypt = "0.11"
secp256k1 = { version = "0.29", features = ["global-context"] }
unicode-normalization = "0.1"
# Wipe decrypted secret keys from memory on drop (lock/logout) so they don't
# linger in the heap/swap.
zeroize = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Vector search
usearch = "2"

# In-process ONNX embeddings (the only embedding backend).
# default-features off to swap hf-hub's TLS from native-tls (OpenSSL) to rustls
# so the distributable binary carries no libssl/libcrypto dependency;
# ort-download-binaries is re-enabled to keep onnxruntime statically linked in.
fastembed = { version = "4", default-features = false, features = ["ort-download-binaries", "hf-hub-rustls-tls"] }

# Single-exe bundling: embed the built SPA (web/build/) into the binary and
# open the browser on launch. In debug builds rust-embed reads from disk so the
# UI hot-reloads without a rebuild; release builds bake the assets in.
rust-embed = { version = "8", features = ["mime-guess"] }
webbrowser = "1"
# In-process document text extraction (replaces the Python sidecar /parse).
pdf-extract = "0.10.0"
epub = "2.1.5"
html2text = "0.17.1"
# DOCX is a zip of XML; only the deflate codec is needed, so drop zip's heavy
# default codecs (zstd/bzip2 and their C builds) to keep the build light.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "0.40.1"

[dev-dependencies]
tempfile = "3.24.0"
tokio-test = "0.4"
