<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="data:," />
		<title>tendrl workbench</title>
		<!-- No-flash text scale: apply the saved Appearance preset to the root
		     --text-scale before first paint, so the UI never renders at the
		     default size and then jump-rescales. Mirror of TEXT_SCALE_PRESETS in
		     src/lib/theme/text-scale.svelte.ts — keep the factors in sync. -->
		<script>
			(function () {
				try {
					var f = { compact: 1.0, default: 1.08, large: 1.23, xlarge: 1.38 };
					var id = localStorage.getItem('tendrl.textScale');
					if (f[id]) document.documentElement.style.setProperty('--text-scale', String(f[id]));
				} catch (e) {
					/* no localStorage — stylesheet default (1.08) applies */
				}
			})();
		</script>
		<!-- No-flash theme + contrast: apply both before first paint. Theme
		     default ('iceberg-dark') uses no attribute. High contrast follows the
		     explicit choice, else the OS prefers-contrast setting. Keep in sync
		     with lib/themes.ts. -->
		<script>
			try {
				var t = localStorage.getItem('tendrl.theme');
				if (t && t !== 'iceberg-dark')
					document.documentElement.setAttribute('data-theme', t);
				var c = localStorage.getItem('tendrl.contrast');
				if (c === 'high' || (c !== 'normal' && matchMedia('(prefers-contrast: more)').matches))
					document.documentElement.setAttribute('data-contrast', 'high');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
