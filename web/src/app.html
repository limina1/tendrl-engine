<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- interactive-widget=resizes-content: the on-screen keyboard shrinks the
		     layout viewport (Android Chrome/WebView) instead of overlaying it, so
		     the mobile shell's bottom bar and the composer's action row stay
		     visible while typing. Browsers without the key (iOS Safari) fall back
		     to the visualViewport tracking in wm/shell.svelte.ts (--kb-inset). -->
		<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
		<link rel="icon" href="data:," />
		<title>tendrl workbench</title>
		<!-- No-flash text scale: apply the saved Appearance factor to the root
		     --text-scale before first paint, so the UI never renders at the
		     default size and then jump-rescales. Mirror of the bounds + legacy
		     preset map in src/lib/theme/text-scale.svelte.ts — keep in sync. -->
		<script>
			(function () {
				try {
					var f = parseFloat(localStorage.getItem('tendrl.textScaleFactor'));
					if (!(f > 0)) {
						// Settings saved before the stepper replaced the preset ladder.
						var legacy = { compact: 1.0, default: 1.08, large: 1.23, xlarge: 1.38 };
						f = legacy[localStorage.getItem('tendrl.textScale')];
					}
					if (f > 0)
						document.documentElement.style.setProperty(
							'--text-scale',
							String(Math.min(2.0, Math.max(0.8, f)))
						);
				} catch (e) {
					/* no localStorage — stylesheet default (1.08) applies */
				}
			})();
		</script>
		<!-- No-flash theme + contrast: apply both before first paint. Theme
		     default ('iceberg-dark') uses no attribute. High contrast follows the
		     explicit choice, else the OS prefers-contrast setting. Keep in sync
		     with lib/themes.ts. -->
		<script>
			try {
				var t = localStorage.getItem('tendrl.theme');
				if (t && t !== 'iceberg-dark')
					document.documentElement.setAttribute('data-theme', t);
				var c = localStorage.getItem('tendrl.contrast');
				if (c === 'high' || (c !== 'normal' && matchMedia('(prefers-contrast: more)').matches))
					document.documentElement.setAttribute('data-contrast', 'high');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
