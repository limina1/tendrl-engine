# tendrl-engine configuration
# Copy to config.toml and customize, then run:
#   cargo run -- -c config.toml
# or start the whole stack (engine + web):
#   ./start.sh
#
# Note: the Settings page's "Save settings" rewrites config.toml in place
# (sections come back alphabetized). Comments in your copy will not survive
# the first save — this file is the documented reference.

[identity]
# Signer *preferences* only — no keys, no pubkeys live here. Identity is
# established at runtime: the user signs via NIP-07 or a pasted ncryptsec; the
# assistant via a pasted nsec/ncryptsec persisted in the OS keyring. `by:me` /
# `by:assistant` resolve from whoever is logged in. (A stale `pubkey` /
# `assistant` / `ncryptsec` from an older config is ignored.)

# Last-chosen signing source: "engine" (key pasted into the engine) or "nip07"
# (browser extension). Written by Save Settings; lets the engine know which
# signer to reattach to on startup so a NIP-07 user doesn't flash "engine".
# source = "engine"

# Auto-lock the unlocked engine key after N minutes of inactivity.
# 0 = never auto-lock. Only meaningful for the engine source.
# lock_timeout_minutes = 0

[network]
# "auto"    — fetch from relays automatically.
# "confirm" — every user-initiated relay fetch/publish pops a confirmation
#             modal in the UI before the engine touches the network.
# Engine default is "confirm" when this section is absent.
mode = "confirm"
# Whether the user has made an explicit first-run mode choice. Left false
# (or absent) on a fresh install so the UI shows a one-time "choose your
# default network mode" modal before any relay fetch. Set true automatically
# once a mode is picked in the UI — you normally don't edit this by hand.
# mode_chosen = false

[relay]
timeout_ms = 15000

# initial_relays: bootstrap seed used only on first boot to populate the
# runtime relay sets. After that, edit relays via the UI; changes persist
# to <data_dir>/relays.json (the live working sets — general / fetch /
# publish). This list is never re-read once relays.json exists.
initial_relays = [
    "wss://relay.damus.io",
    "wss://relay.noswhere.com",
    "wss://nos.lol",
]

# Authors to follow — fetch their events from fetch relays.
# authors = ["npub1..."]

# Embedding / vector search (optional). Embeddings run in-process via ONNX —
# no extra services. The model downloads on first use and is cached next to the
# index. Just set enabled = true.
[embedding]
enabled = false
model = "all-MiniLM-L6-v2"            # friendly name or an explicit fastembed code
dimensions = 384
# Per-pass embedding budget: at most this many events embed per background
# tick; the rest stays queued. Unset = unbounded (desktop default). The
# Android host defaults this to 64 so a fresh install's backlog trickles
# instead of pinning the cores.
# max_per_tick = 64

# AI assistant (optional). The Anthropic API key is NEVER stored here —
# set ANTHROPIC_API_KEY in the environment. Without it the chat falls
# back to a no-op echo provider.
# [ai]
# provider = "claude"                 # "claude" or "noop" (echo, testing)
# model = "claude-sonnet-4-6"
# max_tool_turns = 25                 # cap on tool round-trips per turn
# system_prompt_path = "prompt.md"    # Markdown prepended to the system
#                                     # prompt, re-read each turn; relative
#                                     # to this config file
# enabled_tools = ["search_events"]   # omit for the default policy
#                                     # (everything except publish)

# Editor defaults (written by Save Settings; shown here for reference)
# [editor]
# line_numbers = true
# vim_mode = false
# insert_mode = "append"

# Composer defaults (written by Save Settings)
# [compose]
# default_mode = "plain"
# sync_mode = "explicit"
# button_labels = "icon"

# Documents folder for local imports (optional)
# [documents]
# path = "./docs"

# Server settings (optional)
# [server]
# host = "127.0.0.1"
# port = 3030

# Database settings (optional)
# [database]
# data_dir = "~/.local/share/nostr-engine/nostrdb"
# LMDB map size in MiB. Unset = nostrdb's default (a 32 GiB address-space
# reservation — harmless on desktop). The Android host caps this at 4096;
# if a store ever outgrows the cap, ingest fails with MDB_MAP_FULL — raise it.
# mapsize_mb = 4096
