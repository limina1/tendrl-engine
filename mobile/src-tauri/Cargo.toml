# Tauri 2 Android host for tendrl. Deliberately NOT part of the root
# package/workspace — the engine is consumed as a path dependency with
# default features off (no fastembed/usearch/keyring/webbrowser; the SPA is
# baked in via embed-assets so debug APKs work without a disk web/build).
#
# Build from this directory with the Android env from docs/commands.org:
#   cargo tauri android build --debug --target aarch64
[package]
name = "tendrl-mobile"
version = "0.10.0"
description = "tendrl Android host — engine-in-process behind a token-gated loopback port"
edition = "2021"

[lib]
name = "tendrl_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Full debuginfo makes a ~360MB debug APK; line tables keep useful
# backtraces at a fraction of that for over-the-air installs.
[profile.dev]
debug = "line-tables-only"

# The .so shipped unstripped at 44 MB (~60% of the APK) with no LTO before
# this profile existed. No panic = "abort": the engine deliberately
# spawn-isolates the background embed pass because an on-device ONNX panic
# was observed — abort would turn that survivable panic into app death.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# embeddings-dynamic: fastembed via ort's load-dynamic — the APK ships
# Microsoft's onnxruntime-android AAR (pinned 1.20.0 = ort-sys's expected
# version) and ort dlopens libonnxruntime.so at first embed. arm64-only:
# numkong's x86_64 path miscompiles under bionic (see docs/bugs.org).
nostr-engine = { path = "../..", default-features = false, features = ["embed-assets", "embeddings-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The boot task sleeps between navigate() retries (the WebView is created
# asynchronously and a too-early navigate message is dropped).
tokio = { version = "1", default-features = false, features = ["time"] }
hex = "0.4"
getrandom = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Rust stdout goes nowhere on Android — route tracing to logcat instead
# (tag "tendrl"), or the engine is undebuggable on-device.
[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"
